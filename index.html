<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>死去的回忆突然攻击我 · 心灵空间</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <canvas id="game"></canvas>
  <div id="vignette"></div>

  <div id="hud">
    <div class="hud-eyebrow">第一空间 · 心灵空间</div>
    <div class="hud-progress">逃亡进度：<span id="progressValue">0%</span></div>
    <div class="hud-bar"><i id="progressFill"></i></div>
    <div class="hud-life">
      <span class="life-pip" id="lifePip"></span>
      <span class="life-text">生命：<b id="hpValue">1 / 1</b></span>
    </div>
  </div>

  <div id="hint">
    <span><kbd>←</kbd><kbd>→</kbd> 移动</span>
    <span><kbd>空格</kbd> / <kbd>↑</kbd> 跳跃</span>
    <span><kbd>↓</kbd> / <kbd>S</kbd> 下蹲</span>
  </div>
  <div id="tech">RING BUFFER 120 · FIXED 60Hz · PURE CANVAS</div>

  <div id="death">
    <div class="death-card">
      <div class="death-eyebrow">MEMORY CAUGHT UP</div>
      <h1 id="deathTitle">被回忆追上了</h1>
      <p id="deathSub">你停下的一瞬间，2 秒前的自己就贴了上来。</p>
      <div class="death-stats">
        <span>逃亡进度</span>
        <b id="deathProgress">0%</b>
      </div>
      <button id="restartBtn" type="button">再跑一次</button>
      <div class="death-hint">按 <kbd>R</kbd> 重新开始</div>
    </div>
  </div>

  <script src="js/game.js"></script>
</body>
</html>
